# Render Blueprint for the existing AgriEdge frontend and API.
# DATABASE_URL is entered in the Render service settings from Neon; no credentials here.
services:
  - type: web
    name: agriedge-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: PHONE_HASH_SECRET
        generateValue: true
      - key: DEMO_READ_ONLY
        value: "true"
      - key: ALLOW_REGISTRATION
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: agriedge-frontend
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: agriedge-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: agriedge-api
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Content-Type
        value: application/manifest+json
      - path: /models/plant-disease/model.tflite
        name: Content-Type
        value: application/octet-stream
      - path: /tflite-wasm/*.wasm
        name: Content-Type
        value: application/wasm
